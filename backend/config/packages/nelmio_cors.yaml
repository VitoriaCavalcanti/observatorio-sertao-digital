nelmio_cors:
    defaults:
        origin_regex: true
        allow_origin: ['^https?://([a-z0-9-]+\.)?observatorio\.localhost$']
        allow_methods: ['GET', 'POST', 'PUT', 'PATCH', 'DELETE', 'OPTIONS']
        allow_headers: ['Content-Type', 'Authorization']
        expose_headers: ['Link']
        max_age: 3600
    paths:
        '^/api/':
            allow_origin: ['^https?://([a-z0-9-]+\.)?observatorio\.localhost$']
            allow_methods: ['GET', 'POST', 'PUT', 'PATCH', 'DELETE', 'OPTIONS']
            allow_headers: ['Content-Type', 'Authorization']
            max_age: 3600
