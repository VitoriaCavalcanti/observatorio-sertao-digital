services:
  frontend:
    build:
      context: ./frontend
    container_name: observatorio_frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "4200:4200"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    container_name: observatorio_backend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "postgresql://observatorio:observatorio@database:5432/observatorio?serverVersion=17&charset=utf8"
    depends_on:

      - database
  database:
    image: postgres:17-alpine
    container_name: observatorio_database
    restart: unless-stopped
    environment:
      POSTGRES_DB: observatorio
      POSTGRES_USER: observatorio
      POSTGRES_PASSWORD: observatorio
    ports:
      - "5432:5432"
    volumes:
      - database_data:/var/lib/postgresql/data

  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: observatorio_meilisearch
    restart: unless-stopped
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: observatorio_master_key
    ports:
      - "7700:7700"
    volumes:
      - meilisearch_data:/meili_data

volumes:
  database_data:
  meilisearch_data: