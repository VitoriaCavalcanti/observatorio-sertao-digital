<header class="site-header">
  <a class="brand" routerLink="/" aria-label="Página inicial do Observatório Sertão Digital">
    <span class="brand-mark">OS</span>
    <span>Observatório<br />Sertão Digital</span>
  </a>
  <nav aria-label="Navegação principal">
    <a routerLink="/instituicoes" routerLinkActive="active">Instituições</a>
    <a routerLink="/projetos" routerLinkActive="active">Projetos</a>
    <a routerLink="/indicadores" routerLinkActive="active">Indicadores</a>
    <a routerLink="/avisos" routerLinkActive="active">Avisos</a>
    <a routerLink="/busca" routerLinkActive="active">Buscar</a>
    <a class="search-link" [routerLink]="auth.usuario() ? '/minha-area' : '/entrar'" routerLinkActive="active">{{ auth.usuario() ? 'Minha área' : 'Entrar' }}</a>
  </nav>
</header>

<router-outlet />

<footer class="site-footer">
  <p>Observatório Sertão Digital — conhecimento aberto sobre o ecossistema digital do Sertão.</p>
  <a href="http://admin.observatorio.localhost">Área administrativa</a>
</footer>
